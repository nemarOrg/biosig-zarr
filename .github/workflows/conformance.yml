name: conformance

# The schemas and the conformance vectors: check each against the other, and the vectors
# against their manifest. A pull request runs once, on its own event; a push runs only on main.
on:
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "conformance/**"
      - "tools/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "conformance/**"
      - "tools/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/conformance.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A push to main is never cancelled: its run is the record that main passed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  schemas:
    name: schemas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check:schemas

  vectors:
    name: vectors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.13"
          enable-cache: false
      - run: uv run --project tools/vectors --locked ruff check tools
      - run: uv run --project tools/vectors --locked ruff format --check tools
      - run: uv run --project tools/vectors --locked ty check tools/vectors
      - run: uv run --project tools/vectors --locked pytest tools/vectors -q
