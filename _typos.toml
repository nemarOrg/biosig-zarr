# Words the specification uses that the spell checker does not know.
# Legal texts, the lockfile and the conformance stores (a writer's output) are not checked.
[files]
extend-exclude = ["LICENSES/", "bun.lock", "conformance/stores/"]

[default.extend-words]
bzx = "bzx"
biosigio = "biosigio"
hdmf = "hdmf"
nemar = "nemar"
rfcs = "rfcs"
NGFF = "NGFF"
ND = "ND"
HED = "HED"
hed = "hed"
OME = "OME"
